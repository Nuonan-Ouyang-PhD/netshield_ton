name: repository-integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify campaign audit
        run: python3 scripts/verify_campaign_audit.py
      - name: Verify methodology package
        run: python3 scripts/verify_methodology.py
      - name: Verify evidence snapshot
        run: python3 scripts/verify_submission.py
      - name: Verify clean submission package
        run: python3 submission/validate_submission.py
      - name: Verify supporting archive
        working-directory: supporting_material/archive/v4_4
        run: sha256sum -c docs/MANIFEST_SHA256.txt
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
